name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: the template leans on Textual's private ToggleButton markers.
      - run: python -m pip install textual==8.2.8
      - run: sh check.sh
