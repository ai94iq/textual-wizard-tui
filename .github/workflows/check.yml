name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Several rules exist because of Windows: the alternate screen,
        # ctrl+c, OS-specific placeholders. Run where the users are.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: the template leans on Textual's private ToggleButton markers.
      - run: python -m pip install textual==8.2.8
      - run: sh check.sh
